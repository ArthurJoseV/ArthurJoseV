name: Generate Pacman Game

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch: # Permite que você execute manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Gera o jogo do Pac-Man a partir do seu gráfico de contribuições
      - name: Generate Pacman Game
        uses: abozanona/pacman-contribution@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}

      # Envia o arquivo SVG gerado para uma branch separada chamada "output"
      - name: Push Pacman SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
